<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord MVP</title>
    <style>
        :root {
            --bg-darker: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-chat: #313338;
            --bg-input: #383a40;
            --text-main: #dbdee1;
            --text-muted: #949ba4;
            --discord-blue: #5865f2;
            --discord-green: #23a55a;
            --discord-red: #da373c;
            --discord-offline: #4e5058;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-darker); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 220px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
        .server-header { padding: 15px; font-weight: bold; font-size: 16px; border-bottom: 1px solid #1f2023; color: #fff; }
        .channels-list { flex-grow: 1; padding: 10px 8px; }
        .channel-item { padding: 8px 12px; border-radius: 4px; color: var(--text-muted); font-size: 15px; margin-bottom: 2px; cursor: pointer; }
        .channel-item.active { background-color: #35373c; color: var(--text-main); }
        .channel-item::before { content: "# "; font-weight: bold; }
        .user-profile { padding: 10px; background: #232428; display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .user-profile .my-tag { font-size: 11px; color: var(--text-muted); }

        .chat-area { flex-grow: 1; background-color: var(--bg-chat); display: flex; flex-direction: column; position: relative; }
        .chat-header { padding: 15px 20px; font-weight: bold; font-size: 16px; border-bottom: 1px solid #2e3035; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .call-controls-top { display: none; gap: 10px; }
        .call-btn-top { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); padding: 5px; border-radius: 4px; }
        .call-btn-top:hover { color: white; background: #404249; }

        .messages-container { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .message { display: flex; align-items: flex-start; }
        .message.private-msg { background: rgba(88, 101, 242, 0.05); border-left: 3px solid var(--discord-blue); padding-left: 5px; }
        .avatar { width: 40px; height: 40px; background-color: var(--discord-blue); border-radius: 50%; margin-right: 16px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; text-transform: uppercase; flex-shrink: 0; }
        .message-content { display: flex; flex-direction: column; }
        .message-user { font-weight: 600; color: #f2f3f5; font-size: 15px; margin-bottom: 4px; }
        .message-user span { font-size: 11px; color: var(--text-muted); font-weight: normal; margin-left: 4px; }
        .message-time { font-size: 11px; color: var(--text-muted); margin-left: 8px; font-weight: 400; }
        .message-text { color: var(--text-main); font-size: 15px; word-break: break-word; line-height: 1.4; }
        .audio-player { margin-top: 5px; outline: none; border-radius: 4px; height: 36px; max-width: 260px; }

        .video-container { display: none; background: #111214; padding: 15px; flex-direction: row; gap: 15px; justify-content: center; align-items: center; border-bottom: 2px solid #2e3035; min-height: 200px; position: relative; }
        video { width: 45%; max-width: 320px; height: auto; border-radius: 8px; background: #2b2d31; transform: scaleX(-1); }
        #remoteVideo { transform: none; }
        
        .video-overlay-buttons { position: absolute; bottom: 10px; display: flex; gap: 15px; }
        .end-call-btn { background: var(--discord-red); border: none; color: white; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .end-call-btn:hover { background: #b82e33; }

        .incoming-call-popup { display: none; position: absolute; top: 60px; left: 50%; transform: translateX(-50%); background: var(--bg-sidebar); border: 2px solid var(--discord-blue); border-radius: 8px; padding: 15px 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 100; align-items: center; gap: 20px; }
        .popup-accept { background: var(--discord-green); border: none; color: white; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .popup-reject { background: var(--discord-red); border: none; color: white; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        .input-area { padding: 0 20px 24px 20px; }
        .input-wrapper { background-color: var(--bg-input); border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
        #input { flex-grow: 1; background: none; border: none; outline: none; color: var(--text-main); font-size: 15px; }
        .mic-btn { background: none; border: none; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; color: var(--text-muted); transition: all 0.2s; }
        .mic-btn:hover { color: white; background: #404249; }
        .mic-btn.recording { color: white; background: var(--discord-red); animation: pulse 1.2s infinite; }

        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }

        .right-sidebar { width: 240px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; border-left: 1px solid #2e3035; flex-shrink: 0; padding: 15px 10px; gap: 20px; }
        .section-title { font-size: 12px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .user-list-item { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 4px; font-size: 14px; cursor: pointer; }
        .user-list-item:hover { background: #35373c; }
        .user-list-item.active-chat { background: #404249; color: #fff; }
        .user-list-item.is-offline { opacity: 0.4; }
        .user-list-item .mini-avatar { width: 24px; height: 24px; background: var(--discord-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: white; }
        
        .friend-btn { background: var(--discord-blue); color: white; border: none; padding: 8px 10px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 13px; font-weight: 500; }
        #friend-id-input { width: 100%; padding: 8px; background: var(--bg-input); border: none; border-radius: 4px; color: white; margin-bottom: 6px; font-size: 13px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--bg-darker); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="server-header">🪐 Мій Сервер</div>
        <div class="channels-list">
            <div class="channel-item active" id="channel-main-btn" onclick="switchToMainChat()">основний</div>
        </div>
        <div class="user-profile" id="my-profile-box" style="display:none;">
            <div class="mini-avatar" id="my-avatar" style="width:32px; height:32px; background:var(--discord-green); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; color:white;"></div>
            <div>
                <div id="my-username" style="font-weight:600;"></div>
                <div class="my-tag">ID: <span id="my-id"></span></div>
            </div>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <span id="chat-title"># основний</span>
            <div class="call-controls-top" id="call-controls-top">
                <button class="call-btn-top" onclick="startCall(false)" title="Голосовий дзвінок">📞</button>
                <button class="call-btn-top" onclick="startCall(true)" title="Відеодзвінок">📹</button>
            </div>
        </div>

        <div class="incoming-call-popup" id="incoming-call-popup">
            <span id="incoming-call-text">Вхідний дзвінок...</span>
            <button class="popup-accept" id="btn-accept-call">Прийняти</button>
            <button class="popup-reject" id="btn-reject-call">Відхилити</button>
        </div>

        <div class="video-container" id="video-container">
            <video id="localVideo" autoplay playsinline muted></video>
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="video-overlay-buttons">
                <button class="end-call-btn" onclick="endCall()">Покласти слухавку 🛑</button>
            </div>
        </div>

        <div class="messages-container" id="messages"></div>
        <div class="input-area">
            <form id="form" action="">
                <div class="input-wrapper">
                    <button type="button" class="mic-btn" id="mic-btn" title="Записати ГС" disabled>🎤</button>
                    <input id="input" autocomplete="off" placeholder="Увійдіть в акаунт..." disabled />
                </div>
            </form>
        </div>
    </div>

    <div class="right-sidebar">
        <div>
            <div class="section-title">Додати друга</div>
            <input type="number" id="friend-id-input" placeholder="Введіть 4-значний ID..." />
            <button class="friend-btn" id="add-friend-btn">Надіслати запит</button>
        </div>
        <div>
            <div class="section-title">Друзі</div>
            <div id="friends-box"></div>
        </div>
        <div>
            <div class="section-title">Всі в мережі</div>
            <div id="online-users-list"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

        const callControlsTop = document.getElementById('call-controls-top');
        const videoContainer = document.getElementById('video-container');
        const incomingCallPopup = document.getElementById('incoming-call-popup');

        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordingStream = null; // Потік суто для ГС

        let localStream = null;
        let peerConnection = null;
