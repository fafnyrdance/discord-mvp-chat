<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord MVP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-family/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-darker: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-chat: #313338;
            --bg-input: #383a40;
            --text-main: #dbdee1;
            --text-muted: #949ba4;
            --discord-blue: #5865f2;
            --discord-green: #23a55a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-darker);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Бокова панель серверов / каналів */
        .sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-top-left-radius: 8px;
        }

        .server-header {
            padding: 15px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #1f2023;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            color: #fff;
        }

        .channels-list {
            flex-grow: 1;
            padding: 10px 8px;
        }

        .channel-item {
            padding: 8px 12px;
            border-radius: 4px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            margin-bottom: 2px;
            font-size: 15px;
            transition: background 0.2s, color 0.2s;
        }

        .channel-item:hover, .channel-item.active {
            background-color: #35373c;
            color: var(--text-main);
        }

        .channel-item span { margin-right: 6px; font-size: 18px; font-weight: bold; }

        /* Головна зона чату */
        .chat-area {
            flex-grow: 1;
            background-color: var(--bg-chat);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px 20px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #2e3035;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            color: #fff;
        }

        .chat-header .hashtag { color: var(--text-muted); margin-right: 8px; font-size: 20px; }

        .messages-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Стиль повідомлення а-ля Discord */
        .message {
            display: flex;
            align-items: flex-start;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background-color: var(--discord-blue);
            border-radius: 50%;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            flex-shrink: 0;
        }

        .message-content { display: flex; flex-direction: column; }

        .message-user {
            font-weight: 500;
            color: #f2f3f5;
            font-size: 15px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: 8px;
            font-weight: 400;
        }

        .message-text {
            color: var(--text-main);
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        /* Форма відправки */
        .input-area { padding: 0 20px 24px 20px; background-color: var(--bg-chat); }

        .input-wrapper {
            background-color: var(--bg-input);
            border-radius: 8px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
        }

        #input {
            flex-grow: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 15px;
        }

        #input::placeholder { color: #6d737d; }

        .send-btn {
            background-color: var(--discord-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover { background-color: #4752c4; }

        /* Кастомізація скроллбару */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-chat); }
        ::-webkit-scrollbar-thumb { background: var(--bg-darker); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="server-header">🪐 Мій Сервер</div>
        <div class="channels-list">
            <div class="channel-item active"><span>#</span>основний</div>
            <div class="channel-item"><span>#</span>меми</div>
            <div class="channel-item"><span>#</span>ігри</div>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <span class="hashtag">#</span> основний
        </div>
        
        <div class="messages-container" id="messages">
            </div>

        <div class="input-area">
            <form id="form" action="" style="display: block;">
                <div class="input-wrapper">
                    <input id="input" autocomplete="off" placeholder="Написати в #основний..." />
                    <button class="send-btn">Надіслати</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messagesContainer = document.getElementById('messages');

        // Генеруємо випадковий аватар для сесії (просто перша літера)
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const randomLetter = alphabet[Math.floor(Math.random() * alphabet.length)];

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value) {
                // Відправляємо об'єкт із текстом та аватаром
                socket.emit('chat message', {
                    text: input.value,
                    avatar: randomLetter
                });
                input.value = '';
            }
        });

        socket.on('chat message', (data) => {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // Створюємо структуру повідомлення Discord
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');

            // Якщо прийшла просто строка (від старого коду), робимо заглушку
            const text = data.text || data;
            const avatarLetter = data.avatar || "U";

            messageDiv.innerHTML = `
                <div class="avatar">${avatarLetter}</div>
                <div class="message-content">
                    <div class="message-user">
                        Користувач ${avatarLetter}
                        <span class="message-time">Сьогодні о ${timeString}</span>
                    </div>
                    <div class="message-text">${text}</div>
                </div>
            `;

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
    </script>
</body>
</html>
