<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord MVP</title>
    <style>
        :root {
            --bg-darker: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-chat: #313338;
            --bg-input: #383a40;
            --text-main: #dbdee1;
            --text-muted: #949ba4;
            --discord-blue: #5865f2;
            --discord-green: #23a55a;
            --discord-red: #da373c;
            --discord-offline: #4e5058;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-darker); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 220px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
        .server-header { padding: 15px; font-weight: bold; font-size: 16px; border-bottom: 1px solid #1f2023; color: #fff; }
        .channels-list { flex-grow: 1; padding: 10px 8px; }
        .channel-item { padding: 8px 12px; border-radius: 4px; color: var(--text-muted); font-size: 15px; margin-bottom: 2px; cursor: pointer; }
        .channel-item.active { background-color: #35373c; color: var(--text-main); }
        .channel-item::before { content: "# "; font-weight: bold; }
        .user-profile { padding: 10px; background: #232428; display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .user-profile .my-tag { font-size: 11px; color: var(--text-muted); }

        .chat-area { flex-grow: 1; background-color: var(--bg-chat); display: flex; flex-direction: column; }
        .chat-header { padding: 15px 20px; font-weight: bold; font-size: 16px; border-bottom: 1px solid #2e3035; color: #fff; }
        .messages-container { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        
        .message { display: flex; align-items: flex-start; }
        .message.private-msg { background: rgba(88, 101, 242, 0.05); border-left: 3px solid var(--discord-blue); padding-left: 5px; }
        
        .avatar { width: 40px; height: 40px; background-color: var(--discord-blue); border-radius: 50%; margin-right: 16px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; text-transform: uppercase; flex-shrink: 0; }
        .message-content { display: flex; flex-direction: column; }
        .message-user { font-weight: 600; color: #f2f3f5; font-size: 15px; margin-bottom: 4px; }
        .message-user span { font-size: 11px; color: var(--text-muted); font-weight: normal; margin-left: 4px; }
        .message-time { font-size: 11px; color: var(--text-muted); margin-left: 8px; font-weight: 400; }
        .message-text { color: var(--text-main); font-size: 15px; word-break: break-word; line-height: 1.4; }

        /* Голосовий плеєр всередині повідомлення */
        .audio-player { margin-top: 5px; outline: none; border-radius: 4px; height: 36px; max-width: 260px; }

        .input-area { padding: 0 20px 24px 20px; }
        .input-wrapper { background-color: var(--bg-input); border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
        #input { flex-grow: 1; background: none; border: none; outline: none; color: var(--text-main); font-size: 15px; }

        /* Кнопка мікрофона */
        .mic-btn { background: none; border: none; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; color: var(--text-muted); transition: all 0.2s; }
        .mic-btn:hover { color: white; background: #404249; }
        .mic-btn.recording { color: white; background: var(--discord-red); animation: pulse 1.2s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        .right-sidebar { width: 240px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; border-left: 1px solid #2e3035; flex-shrink: 0; padding: 15px 10px; gap: 20px; }
        .section-title { font-size: 12px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .user-list-item { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 4px; font-size: 14px; cursor: pointer; }
        .user-list-item:hover { background: #35373c; }
        .user-list-item.active-chat { background: #404249; color: #fff; }
        .user-list-item.is-offline { opacity: 0.4; }
        .user-list-item .mini-avatar { width: 24px; height: 24px; background: var(--discord-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: white; }
        
        .friend-btn { background: var(--discord-blue); color: white; border: none; padding: 8px 10px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 13px; font-weight: 500; }
        #friend-id-input { width: 100%; padding: 8px; background: var(--bg-input); border: none; border-radius: 4px; color: white; margin-bottom: 6px; font-size: 13px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--bg-darker); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="server-header">🪐 Мій Сервер</div>
        <div class="channels-list">
            <div class="channel-item active" id="channel-main-btn" onclick="switchToMainChat()">основний</div>
        </div>
        <div class="user-profile" id="my-profile-box" style="display:none;">
            <div class="mini-avatar" id="my-avatar" style="width:32px; height:32px; background:var(--discord-green); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; color:white;"></div>
            <div>
                <div id="my-username" style="font-weight:600;"></div>
                <div class="my-tag">ID: <span id="my-id"></span></div>
            </div>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header" id="chat-title"># основний</div>
        <div class="messages-container" id="messages"></div>
        <div class="input-area">
            <form id="form" action="">
                <div class="input-wrapper">
                    <button type="button" class="mic-btn" id="mic-btn" title="Записати ГС" disabled>🎤</button>
                    <input id="input" autocomplete="off" placeholder="Увійдіть в акаунт..." disabled />
                </div>
            </form>
        </div>
    </div>

    <div class="right-sidebar">
        <div>
            <div class="section-title">Додати друга</div>
            <input type="number" id="friend-id-input" placeholder="Введіть 4-значний ID..." />
            <button class="friend-btn" id="add-friend-btn">Надіслати запит</button>
        </div>
        <div>
            <div class="section-title">Друзі</div>
            <div id="friends-box"></div>
        </div>
        <div>
            <div class="section-title">Всі в мережі</div>
            <div id="online-users-list"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messagesContainer = document.getElementById('messages');
        const micBtn = document.getElementById('mic-btn');

        let currentChatTarget = null; 
        let myId = null;
        let globalUsersCache = [];
        let myFriendsList = [];
        let allMessages = [];
        let savedFriendsNames = JSON.parse(localStorage.getItem('saved_friends_names') || '{}');

        // Змінні для запису звуку
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        function askAuth() {
            let name = prompt("Введіть нікнейм:");
            if (!name) return askAuth();
            let pass = prompt("Введіть пароль:");
            if (!pass) return askAuth();

            socket.emit('register user', { username: name, password: pass }, (res) => {
                if (res.success) {
                    myId = res.user.id;
                    document.getElementById('my-profile-box').style.display = 'flex';
                    document.getElementById('my-username').textContent = res.user.username;
                    document.getElementById('my-id').textContent = res.user.id;
                    document.getElementById('my-avatar').textContent = res.user.avatar;
                    
                    input.disabled = false;
                    micBtn.disabled = false; // Активуємо мікрофон
                    input.placeholder = `Написати в #основний...`;
                    initAudioRecorder(); // Налаштовуємо мікрофон розробника
                } else {
                    alert(res.reason);
                    askAuth();
                }
            });
        }

        askAuth();

        // НАЛАШТУВАННЯ ЗАПИСУ ЗВУКУ
        async function initAudioRecorder() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];

                    // Перетворюємо аудіо-файл у рядок base64 для відправки через сокети
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        const base64Audio = reader.result;
                        socket.emit('chat message', {
                            text: null,
                            audio: base64Audio,
                            toId: currentChatTarget
                        });
                    };
                };
            } catch (err) {
                console.error("Помилка доступу до мікрофона:", err);
                alert("Не вдалося отримати доступ до мікрофона. Перевір дозволи браузера!");
            }
        }

        // Клікнули на мікрофон
        micBtn.addEventListener('click', () => {
            if (!mediaRecorder) return;

            if (!isRecording) {
                // Почати запис
                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
                input.disabled = true;
                input.placeholder = "Запис голосового повідомлення...";
            } else {
                // Зупинити запис та надіслати
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                input.disabled = false;
                input.placeholder = currentChatTarget ? "Написати для друга..." : "Написати в #основний...";
            }
        });

        function renderMessages() {
            messagesContainer.innerHTML = '';
            allMessages.forEach(msg => {
                if (!currentChatTarget) {
                    if (msg.isPrivate) return;
                } else {
                    if (!msg.isPrivate) return;
                    const isFromMeToFriend = (msg.userId === myId && msg.toId === currentChatTarget);
                    const isFromFriendToMe = (msg.userId === currentChatTarget && msg.toId === myId);
                    if (!isFromMeToFriend && !isFromFriendToMe) return;
                }

                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message');
                if (msg.isPrivate) messageDiv.classList.add('private-msg');
                
                // Якщо є текст — малюємо його, якщо є аудіо — вбудовуємо плеєр
                let contentHTML = msg.text ? `<div class="message-text">${msg.text}</div>` : '';
                if (msg.audio) {
                    contentHTML += `<audio class="audio-player" src="${msg.audio}" controls></audio>`;
                }
                
                messageDiv.innerHTML = `
                    <div class="avatar">${msg.avatar}</div>
                    <div class="message-content">
                        <div class="message-user">
                            ${msg.user} <span>#${msg.userId} ${msg.isPrivate ? '[ЛС]' : ''}</span>
                            <span class="message-time">${msg.time}</span>
                        </div>
                        ${contentHTML}
                    </div>
                `;
                messagesContainer.appendChild(messageDiv);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function switchToMainChat() {
            currentChatTarget = null;
            document.getElementById('channel-main-btn').classList.add('active');
            document.getElementById('chat-title').textContent = '# основний';
            input.placeholder = "Написати в #основний...";
            document.querySelectorAll('#friends-box .user-list-item').forEach(el => el.classList.remove('active-chat'));
            renderMessages();
        }

        function switchToPrivateChat(friendId, friendName) {
            currentChatTarget = friendId;
            document.getElementById('channel-main-btn').classList.remove('active');
            document.getElementById('chat-title').textContent = `💬 Особисті з ${friendName}`;
            input.placeholder = `Написати для ${friendName}...`;
            
            document.querySelectorAll('#friends-box .user-list-item').forEach(el => {
                el.classList.remove('active-chat');
                if(parseInt(el.dataset.id) === friendId) el.classList.add('active-chat');
            });
            renderMessages();
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                socket.emit('chat message', { text: input.value, toId: currentChatTarget });
                input.value = '';
            }
        });

        document.getElementById('add-friend-btn').addEventListener('click', () => {
            const idInput = document.getElementById('friend-id-input');
            const targetId = parseInt(idInput.value);
            if (!targetId) return;

            socket.emit('add friend', targetId, (res) => {
                if (res.success) {
                    alert(`Успішно додано!`);
                    savedFriendsNames[targetId] = res.friendName;
                    localStorage.setItem('saved_friends_names', JSON.stringify(savedFriendsNames));
                } else {
                    alert(res.reason);
                }
                idInput.value = '';
            });
        });

        socket.on('friend added', (data) => {
            alert(`Користувач ${data.username} додав вас у друзі!`);
            savedFriendsNames[data.id] = data.username;
            localStorage.setItem('saved_friends_names', JSON.stringify(savedFriendsNames));
        });

        socket.on('update users', (users) => {
            globalUsersCache = users;
            const listContainer = document.getElementById('online-users-list');
            listContainer.innerHTML = '';

            const myUserObj = users.find(u => u.id === myId);
            if (myUserObj && myUserObj.friends) myFriendsList = myUserObj.friends;

            users.forEach(u => {
                const item = document.createElement('div');
                item.classList.add('user-list-item');
                item.innerHTML = `
                    <div class="mini-avatar">${u.avatar}</div>
                    <div>${u.username} <span style="font-size:11px; color:var(--text-muted);">#${u.id}</span></div>
                `;
                listContainer.appendChild(item);
                if (myFriendsList.includes(u.id)) savedFriendsNames[u.id] = u.username;
            });
            localStorage.setItem('saved_friends_names', JSON.stringify(savedFriendsNames));

            const friendsContainer = document.getElementById('friends-box');
            friendsContainer.innerHTML = '';

            if (myFriendsList.length === 0) {
                friendsContainer.innerHTML = '<div style="font-size:13px; color:var(--text-muted);">Немає друзів</div>';
            } else {
                myFriendsList.forEach(friendId => {
                    const onlineFriend = users.find(u => u.id === friendId);
                    const fItem = document.createElement('div');
                    fItem.classList.add('user-list-item');
                    fItem.dataset.id = friendId;
                    if (currentChatTarget === friendId) fItem.classList.add('active-chat');

                    if (onlineFriend) {
                        fItem.innerHTML = `
                            <div class="mini-avatar" style="background:var(--discord-green)">${onlineFriend.avatar}</div>
                            <div>${onlineFriend.username} <span style="font-size:11px; color:var(--text-muted);">#${friendId}</span></div>
                        `;
                        fItem.onclick = () => switchToPrivateChat(onlineFriend.id, onlineFriend.username);
                    } else {
                        const oldName = savedFriendsNames[friendId] || "Користувач";
                        fItem.classList.add('is-offline');
                        fItem.innerHTML = `
                            <div class="mini-avatar" style="background:var(--discord-offline)">${oldName.charAt(0).toUpperCase()}</div>
                            <div>${oldName} <span style="font-size:11px; color:var(--text-muted);">#${friendId} [офлайн]</span></div>
                        `;
                        fItem.onclick = () => switchToPrivateChat(friendId, oldName);
                    }
                    friendsContainer.appendChild(fItem);
                });
            }
        });

        socket.on('load history', (history) => {
            allMessages = history;
            renderMessages();
        });

        socket.on('chat message', (msg) => {
            allMessages.push(msg);
            renderMessages();
        });
    </script>
</body>
</html>
