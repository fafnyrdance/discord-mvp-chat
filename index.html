<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord MVP Chat</title>
    <style>
        body { font-family: sans-serif; background: #36393f; color: #fff; margin: 0; padding: 20px; }
        #chat { max-width: 600px; margin: 0 auto; background: #2f3136; padding: 20px; border-radius: 8px; }
        #messages { list-style-type: none; padding: 0; height: 300px; overflow-y: auto; border-bottom: 1px solid #4f545c; }
        #messages li { padding: 8px; margin-bottom: 5px; background: #40444b; border-radius: 4px; }
        #form { display: flex; margin-top: 10px; }
        #input { flex-grow: 1; padding: 10px; border: none; border-radius: 4px; background: #40444b; color: #fff; }
        button { padding: 10px 20px; border: none; background: #5865F2; color: white; border-radius: 4px; cursor: pointer; margin-left: 10px; }
        button:hover { background: #4752c4; }
    </style>
</head>
<body>
    <div id="chat">
        <h2>🤖 Мій Discord MVP Чат</h2>
        <ul id="messages"></ul>
        <form id="form" action="">
            <input id="input" autocomplete="off" placeholder="Напишіть щось..." /><button>Надіслати</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value) {
                socket.emit('chat message', input.value);
                input.value = '';
            }
        });

        socket.on('chat message', (msg) => {
            const item = document.createElement('li');
            item.textContent = msg;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });
    </script>
</body>
</html>
