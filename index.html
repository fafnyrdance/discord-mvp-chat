<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #313338; color: white; margin: 0; display: flex; height: 100vh; }
        .guilds { width: 72px; background: #1e1f22; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .sidebar { width: 240px; background: #2b2d31; padding: 15px; }
        .chat { flex: 1; display: flex; flex-direction: column; }
        #msgs { flex: 1; padding: 20px; overflow-y: auto; }
        .controls { padding: 20px; background: #383a40; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div class="guilds" id="guilds">
        <button onclick="document.getElementById('m-srv').style.display='flex'">+</button>
    </div>
    <div class="sidebar">
        <h3>Канали</h3>
        <div id="channels"></div>
    </div>
    <div class="chat">
        <div id="msgs"></div>
        <div class="controls">
            <input id="in" placeholder="Повідомлення...">
            <button onclick="call()">📞 Дзвінок</button>
            <button onclick="document.getElementById('m-prof').style.display='flex'">⚙️ Профіль</button>
        </div>
    </div>

    <div id="m-prof" class="modal">
        <div style="background:#313338; padding:20px;">
            <h3>Профіль</h3>
            <input id="p-status" placeholder="Статус">
            <button onclick="saveProfile()">Зберегти</button>
        </div>
    </div>
    <div id="m-srv" class="modal">
        <div style="background:#313338; padding:20px;">
            <h3>Сервер</h3>
            <input id="s-name" placeholder="Назва">
            <button onclick="createSrv()">Створити</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.emit('register user', { username: prompt("Нік?") });
        
        function saveProfile() {
            socket.emit('update profile', { customStatus: document.getElementById('p-status').value });
            document.getElementById('m-prof').style.display = 'none';
        }
        
        function createSrv() {
            socket.emit('create server', document.getElementById('s-name').value, (r) => alert("ID: "+r.server.id));
        }

        document.getElementById('in').onkeydown = (e) => {
            if(e.key === 'Enter') { socket.emit('chat message', { text: e.target.value }); e.target.value = ''; }
        };

        socket.on('chat message', (m) => {
            let div = document.createElement('div');
            div.textContent = m.user + ": " + m.text;
            document.getElementById('msgs').appendChild(div);
        });
    </script>
</body>
</html>
