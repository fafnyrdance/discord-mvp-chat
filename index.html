<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord MVP</title>
    <style>
        :root {
            --bg-darker: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-chat: #313338;
            --bg-input: #383a40;
            --text-main: #dbdee1;
            --text-muted: #949ba4;
            --discord-blue: #5865f2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-darker);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Бокова панель */
        .sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .server-header {
            padding: 15px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #1f2023;
            color: #fff;
        }

        .channels-list {
            flex-grow: 1;
            padding: 10px 8px;
        }

        .channel-item {
            padding: 8px 12px;
            border-radius: 4px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            margin-bottom: 2px;
            font-size: 15px;
        }

        .channel-item.active {
            background-color: #35373c;
            color: var(--text-main);
        }

        .channel-item::before {
            content: "# ";
            font-weight: bold;
            margin-right: 6px;
            color: var(--text-muted);
        }

        /* Зона чату */
        .chat-area {
            flex-grow: 1;
            background-color: var(--bg-chat);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px 20px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #2e3035;
            color: #fff;
        }

        .messages-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Повідомлення */
        .message {
            display: flex;
            align-items: flex-start;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background-color: var(--discord-blue);
            border-radius: 50%;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .message-content { display: flex; flex-direction: column; }

        .message-user {
            font-weight: 600;
            color: #f2f3f5;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: 8px;
            font-weight: 400;
        }

        .message-text {
            color: var(--text-main);
            font-size: 15px;
            word-break: break-word;
            line-height: 1.4;
        }

        /* Поле введення */
        .input-area { padding: 0 20px 24px 20px; }

        .input-wrapper {
            background-color: var(--bg-input);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
        }

        #input {
            flex-grow: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 15px;
        }

        #input::placeholder { color: #6d737d; }

        .send-btn {
            background: var(--discord-blue);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover { background-color: #4752c4; }

        /* Скроллбар */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-chat); }
        ::-webkit-scrollbar-thumb { background: var(--bg-darker); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="server-header">🪐 Мій Сервер</div>
        <div class="channels-list">
            <div class="channel-item active">основний</div>
            <div class="channel-item">меми</div>
            <div class="channel-item">ігри</div>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header"># основний</div>
        <div class="messages-container" id="messages"></div>
        <div class="input-area">
            <form id="form" action="" style="display: block;">
                <div class="input-wrapper">
                    <input id="input" autocomplete="off" placeholder="Написати в #основний..." />
                    <button class="send-btn">Надіслати</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messagesContainer = document.getElementById('messages');

        // Запитуємо ім'я користувача при вході
        let username = prompt("Введіть свій нікнейм для чату:") || "Гість";
        
        // Беремо першу літеру для аватарки
        let avatarLetter = username.charAt(0).toUpperCase();

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value) {
                // Відправляємо об'єкт із текстом, автором та аватаркою
                socket.emit('chat message', {
                    text: input.value,
                    user: username,
                    avatar: avatarLetter
                });
                input.value = '';
            }
        });

        socket.on('chat message', (data) => {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');

            // Перевірка на випадок якщо прийшла просто строка, а не об'єкт
            const text = data.text || data;
            const user = data.user || "Користувач";
            const letter = data.avatar || "U";

            messageDiv.innerHTML = `
                <div class="avatar">${letter}</div>
                <div class="message-content">
                    <div class="message-user">
                        ${user}
                        <span class="message-time">Сьогодні о ${timeString}</span>
                    </div>
                    <div class="message-text">${text}</div>
                </div>
            `;

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
    </script>
</body>
</html>
