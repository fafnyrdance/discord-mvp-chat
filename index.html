<!DOCTYPE html>
<html lang="uk">
<head>
    <style>
        body { background: #313338; color: #dbdee1; margin: 0; display: flex; height: 100vh; font-family: sans-serif; }
        .guilds { width: 72px; background: #1e1f22; display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
        .sidebar { width: 240px; background: #2b2d31; padding: 10px; }
        .chat { flex: 1; display: flex; flex-direction: column; }
        #msgs { flex: 1; padding: 20px; overflow-y: auto; }
        .input { padding: 20px; background: #383a40; margin: 10px; border-radius: 8px; }
        input { width: 100%; background: transparent; border: none; color: white; outline: none; }
    </style>
</head>
<body>
    <div class="guilds">
        <button onclick="s()">+</button>
    </div>
    <div class="sidebar">
        <h3>Канали</h3>
        <div id="channels"></div>
    </div>
    <div class="chat">
        <div id="msgs"></div>
        <div class="input"><input id="in" placeholder="Повідомлення..."></div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        socket.emit('register user', { username: prompt("Твій нік?") });
        function s() { socket.emit('create server', prompt("Назва:"), (r) => alert("Сервер ID: " + r.server.id)); }
        document.getElementById('in').onkeydown = (e) => {
            if(e.key === 'Enter') { socket.emit('chat message', { text: e.target.value }); e.target.value = ''; }
        };
        socket.on('chat message', (m) => {
            let div = document.createElement('div');
            div.textContent = m.user + ": " + m.text;
            document.getElementById('msgs').appendChild(div);
        });
    </script>
</body>
</html>
