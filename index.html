<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord MVP</title>
    <style>
        :root {
            --bg-darker: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-chat: #313338;
            --bg-input: #383a40;
            --text-main: #dbdee1;
            --text-muted: #949ba4;
            --discord-blue: #5865f2;
            --discord-green: #23a55a;
            --discord-red: #da373c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-darker);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Лівий Сайдбар */
        .sidebar {
            width: 220px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .server-header {
            padding: 15px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #1f2023;
            color: #fff;
        }

        .channels-list {
            flex-grow: 1;
            padding: 10px 8px;
        }

        .channel-item {
            padding: 8px 12px;
            border-radius: 4px;
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 2px;
        }

        .channel-item.active {
            background-color: #35373c;
            color: var(--text-main);
        }

        .channel-item::before { content: "# "; font-weight: bold; }

        /* Профіль поточного юзера */
        .user-profile {
            padding: 10px;
            background: #232428;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .user-profile .my-tag { font-size: 11px; color: var(--text-muted); }

        /* Центральний Чат */
        .chat-area {
            flex-grow: 1;
            background-color: var(--bg-chat);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px 20px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #2e3035;
            color: #fff;
        }

        .messages-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message { display: flex; align-items: flex-start; }

        .avatar {
            width: 40px;
            height: 40px;
            background-color: var(--discord-blue);
            border-radius: 50%;
            margin-right: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .message-content { display: flex; flex-direction: column; }
        .message-user { font-weight: 600; color: #f2f3f5; font-size: 15px; margin-bottom: 4px; }
        .message-user span { font-size: 11px; color: var(--text-muted); font-weight: normal; margin-left: 4px; }
        .message-time { font-size: 11px; color: var(--text-muted); margin-left: 8px; font-weight: 400; }
        .message-text { color: var(--text-main); font-size: 15px; word-break: break-word; line-height: 1.4; }

        .input-area { padding: 0 20px 24px 20px; }
        .input-wrapper {
            background-color: var(--bg-input);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
        }

        #input { flex-grow: 1; background: none; border: none; outline: none; color: var(--text-main); font-size: 15px; }

        /* Правий Сайдбар */
        .right-sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-left: 1px solid #2e3035;
            flex-shrink: 0;
            padding: 15px 10px;
            gap: 20px;
        }

        .section-title {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .user-list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px;
            border-radius: 4px;
            font-size: 14px;
        }

        .user-list-item .mini-avatar {
            width: 24px;
            height: 24px;
            background: var(--discord-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        .friend-btn {
            background: var(--discord-blue);
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
            font-weight: 500;
        }
        .friend-btn:hover { background-color: #4752c4; }

        #friend-id-input {
            width: 100%;
            padding: 8px;
            background: var(--bg-input);
            border: none;
            border-radius: 4px;
            color: white;
            margin-bottom: 6px;
            font-size: 13px;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-darker); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="server-header">🪐 Мій Сервер</div>
        <div class="channels-list">
            <div class="channel-item active">основний</div>
        </div>
        <div class="user-profile" id="my-profile-box" style="display:none;">
            <div class="mini-avatar" id="my-avatar" style="width:32px; height:32px; background:var(--discord-green); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold;"></div>
            <div>
                <div id="my-username" style="font-weight:600;"></div>
                <div class="my-tag">ID: <span id="my-id"></span></div>
            </div>
        </div>
    </div>

    <div class="chat-area">
        <div class="chat-header"># основний</div>
        <div class="messages-container" id="messages"></div>
        <div class="input-area">
            <form id="form" action="">
                <div class="input-wrapper">
                    <input id="input" autocomplete="off" placeholder="Написати в #основний..." disabled />
                </div>
            </form>
        </div>
    </div>

    <div class="right-sidebar">
        <div>
            <div class="section-title">Додати друга</div>
            <input type="number" id="friend-id-input" placeholder="Введіть 4-значний ID..." />
            <button class="friend-btn" id="add-friend-btn">Надіслати запит</button>
        </div>

        <div>
            <div class="section-title">Друзі онлайн</div>
            <div id="friends-box" style="font-size:13px; color:var(--text-muted);">У вас поки немає друзів</div>
        </div>

        <div>
            <div class="section-title">Всі в мережі</div>
            <div id="online-users-list"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messagesContainer = document.getElementById('messages');

        let globalUsersCache = []; // Зберігаємо список усіх, щоб швидко перемальовувати друзів
        let myFriendsList = [];    // Список ID моїх друзів

        function askForUsername() {
            let name = prompt("Створіть унікальний нікнейм для входу:");
            if (!name) {
                askForUsername();
                return;
            }

            socket.emit('register user', name, (response) => {
                if (response.success) {
                    document.getElementById('my-profile-box').style.display = 'flex';
                    document.getElementById('my-username').textContent = response.user.username;
                    document.getElementById('my-id').textContent = response.user.id;
                    document.getElementById('my-avatar').textContent = response.user.avatar;
                    
                    input.disabled = false;
                    input.placeholder = `Написати в #основний...`;
                } else {
                    alert(response.reason);
                    askForUsername();
                }
            });
        }

        askForUsername();

        function displayMessage(msg) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.innerHTML = `
                <div class="avatar">${msg.avatar}</div>
                <div class="message-content">
                    <div class="message-user">
                        ${msg.user} <span>#${msg.userId}</span>
                        <span class="message-time">${msg.time}</span>
                    </div>
                    <div class="message-text">${msg.text}</div>
                </div>
            `;
            messagesContainer.appendChild(messageDiv);
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                socket.emit('chat message', input.value);
                input.value = '';
            }
        });

        // Оновлення списку друзів на екрані
        function renderFriends() {
            const friendsContainer = document.getElementById('friends-box');
            friendsContainer.innerHTML = '';

            const activeFriends = globalUsersCache.filter(u => myFriendsList.includes(u.id));

            if (activeFriends.length === 0) {
                friendsContainer.innerHTML = '<div style="font-size:13px; color:var(--text-muted);">У вас поки немає друзів</div>';
                return;
            }

            activeFriends.forEach(u => {
                const fItem = document.createElement('div');
                fItem.classList.add('user-list-item');
                fItem.innerHTML = `
                    <div class="mini-avatar" style="background:var(--discord-green)">${u.avatar}</div>
                    <div>${u.username} <span style="font-size:11px; color:var(--text-muted);">#${u.id}</span></div>
                `;
                friendsContainer.appendChild(fItem);
            });
        }

        // Клікнули "Додати друга"
        document.getElementById('add-friend-btn').addEventListener('click', () => {
            const idInput = document.getElementById('friend-id-input');
            const targetId = parseInt(idInput.value);
            if (!targetId) return;

            socket.emit('add friend', targetId, (res) => {
                if (res.success) {
                    alert(`Успішно! ${res.friendName} доданий у друзі.`);
                    if (!myFriendsList.includes(targetId)) {
                        myFriendsList.push(targetId); // Додаємо локально в список друзів
                    }
                    renderFriends(); // Одразу перемальовуємо блок на екрані
                } else {
                    alert(res.reason);
                }
                idInput.value = '';
            });
        });

        // Хтось інший додав тебе
        socket.on('friend added', (data) => {
            alert(`Користувач ${data.username} #${data.id} додав вас у друзі!`);
            if (!myFriendsList.includes(data.id)) {
                myFriendsList.push(data.id);
            }
            renderFriends();
        });

        // Оновлення списку користувачів онлайн
        socket.on('update users', (users) => {
            globalUsersCache = users; // Оновлюємо кеш
            
            const listContainer = document.getElementById('online-users-list');
            listContainer.innerHTML = '';

            const myId = parseInt(document.getElementById('my-id').textContent || "0");
            const myUserObj = users.find(u => u.id === myId);
            
            if (myUserObj && myUserObj.friends) {
                myFriendsList = myUserObj.friends; // Синхронізуємо друзів з сервером
            }

            users.forEach(u => {
                const item = document.createElement('div');
                item.classList.add('user-list-item');
                item.innerHTML = `
                    <div class="mini-avatar">${u.avatar}</div>
                    <div>${u.username} <span style="font-size:11px; color:var(--text-muted);">#${u.id}</span></div>
                `;
                listContainer.appendChild(item);
            });

            renderFriends(); // Перемальовуємо друзів при будь-якій зміні онлайну
        });

        socket.on('load history', (history) => {
            messagesContainer.innerHTML = '';
            if (Array.isArray(history)) {
                history.forEach(msg => displayMessage(msg));
            }
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });

        socket.on('chat message', (msg) => {
            displayMessage(msg);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
    </script>
</body>
</html>
